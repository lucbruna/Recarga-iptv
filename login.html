<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PainelVendasOnline - Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0f;
    --card: #17171c;
    --card-border: #26262e;
    --purple: #8b5cf6;
    --purple-dim: #4c2e8a;
    --purple-badge: #2d1f52;
    --text: #e8e8ee;
    --muted: #7a7a90;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }

  /* -- BACKGROUND ANIMATION -- */
  .bg-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(150px);
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }
  .bg-glow-1 {
    background: var(--purple);
    top: -200px;
    left: -200px;
    animation: float1 8s ease-in-out infinite;
  }
  .bg-glow-2 {
    background: #6366f1;
    bottom: -200px;
    right: -200px;
    animation: float2 10s ease-in-out infinite;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(80px, 60px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-60px, -80px); }
  }

  /* -- CONTAINER -- */
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
  }

  /* -- LOGO HEADER -- */
  .logo-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 56px;
    height: 56px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--purple), #6366f1);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 8px 32px rgba(139, 92, 246, 0.3);
  }
  .logo-icon svg {
    width: 28px;
    height: 28px;
    color: #fff;
  }
  .logo-header h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .logo-header h1 span:nth-child(1) { color: var(--purple); }
  .logo-header h1 span:nth-child(2) { color: #fff; }
  .logo-header h1 span:nth-child(3) { color: var(--purple); }
  .logo-header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }

  /* -- CARD -- */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
  }

  /* -- TABS -- */
  .tabs {
    display: flex;
    gap: 4px;
    background: #111115;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
  }
  .tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--purple);
    color: #fff;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
  }
  .tab:not(.active):hover {
    color: var(--text);
    background: #1e1e26;
  }

  /* -- FORM -- */
  .form { display: none; }
  .form.active { display: block; animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .input-wrapper {
    position: relative;
  }
  .input-wrapper svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--muted);
    pointer-events: none;
    transition: color 0.2s;
  }
  .input-wrapper input {
    width: 100%;
    background: #111115;
    border: 1px solid var(--card-border);
    color: var(--text);
    border-radius: 12px;
    padding: 13px 14px 13px 44px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrapper input::placeholder {
    color: #4a4a5a;
  }
  .input-wrapper input:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
  }
  .input-wrapper input:focus + svg,
  .input-wrapper input:focus ~ svg {
    color: var(--purple);
  }
  .input-wrapper .toggle-pass {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .input-wrapper .toggle-pass svg {
    position: static;
    transform: none;
    pointer-events: auto;
  }
  .input-wrapper .toggle-pass:hover svg {
    color: var(--text);
  }

  /* -- CONTACT TOGGLE -- */
  .contact-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .contact-toggle button {
    flex: 1;
    padding: 9px;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .contact-toggle button.active {
    background: var(--purple);
    color: #fff;
    border-color: var(--purple);
  }
  .contact-toggle button:not(.active):hover {
    border-color: #3a3a4a;
    color: var(--text);
  }

  /* -- ERROR MSG -- */
  .error-msg {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 18px;
    display: none;
  }
  .error-msg.show {
    display: flex;
    align-items: center;
    gap: 10px;
    animation: shake 0.3s ease;
  }
  .error-msg svg {
    width: 18px;
    height: 18px;
    color: var(--red);
    flex-shrink: 0;
  }
  .error-msg span {
    font-size: 13px;
    color: var(--red);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }

  /* -- SUBMIT BUTTON -- */
  .submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--purple), #6366f1);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 16px rgba(139, 92, 246, 0.3);
  }
  .submit-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(139, 92, 246, 0.4);
  }
  .submit-btn:active {
    transform: translateY(0);
  }
  .submit-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .submit-btn svg {
    width: 18px;
    height: 18px;
  }

  /* -- DIVIDER -- */
  .divider {
    display: flex;
    align-items: center;
    gap: 16px;
    margin: 24px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }
  .divider span {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* -- FORGOT PASSWORD -- */
  .forgot-link {
    text-align: center;
    margin-top: 16px;
  }
  .forgot-link a {
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s;
  }
  .forgot-link a:hover {
    color: var(--purple);
  }

  /* -- TOAST -- */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 300;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.success {
    background: var(--green);
    color: #fff;
  }
  .toast.error {
    background: var(--red);
    color: #fff;
  }
  .toast.info {
    background: var(--purple);
    color: #fff;
  }
  .toast svg {
    width: 18px;
    height: 18px;
  }

  /* -- LOADING SPINNER -- */
  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* -- RESPONSIVE -- */
  @media (max-width: 480px) {
    .card { padding: 24px 20px; }
    .logo-header h1 { font-size: 20px; }
  }

  /* -- SCROLLBAR -- */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2e2e3a; border-radius: 4px; }
</style>
</head>
<body>

<!-- Background Glows -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>

<div class="container">
  <!-- Logo Header -->
  <div class="logo-header">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </div>
    <h1><span>Painel</span><span>Vendas</span><span>Online</span></h1>
    <p>Códigos de recarga para IPTV e streaming</p>
  </div>

  <!-- Card -->
  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" id="tabLogin">Entrar</button>
      <button class="tab" id="tabRegister">Criar Conta</button>
    </div>

    <!-- Error Message -->
    <div class="error-msg" id="errorMsg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="errorText"></span>
    </div>

    <!-- Login Form -->
    <form class="form active" id="loginForm">
      <div class="form-group">
        <label for="loginEmail">E-mail</label>
        <div class="input-wrapper">
          <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="loginPass">Senha</label>
        <div class="input-wrapper">
          <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <button type="button" class="toggle-pass" id="toggleLoginPass">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="loginBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
        Entrar
      </button>

      <div class="forgot-link">
        <a href="#" id="forgotLink">Esqueceu a senha?</a>
      </div>
    </form>

    <!-- Register Form -->
    <form class="form" id="registerForm">
      <div class="form-group">
        <label for="regName">Nome completo</label>
        <div class="input-wrapper">
          <input type="text" id="regName" placeholder="Seu nome completo" required autocomplete="name" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label>Tipo de contato</label>
        <div class="contact-toggle">
          <button type="button" class="active" id="btnWhatsapp" data-type="whatsapp">WhatsApp</button>
          <button type="button" id="btnTelegram" data-type="telegram">Telegram</button>
        </div>
        <div class="input-wrapper">
          <input type="text" id="regContact" placeholder="(11) 99999-9999" required />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">E-mail</label>
        <div class="input-wrapper">
          <input type="email" id="regEmail" placeholder="seu@email.com" required autocomplete="email" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="regPass">Senha</label>
        <div class="input-wrapper">
          <input type="password" id="regPass" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
          <button type="button" class="toggle-pass" id="toggleRegPass">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="regPassConfirm">Confirmar senha</label>
        <div class="input-wrapper">
          <input type="password" id="regPassConfirm" placeholder="Repita a senha" required minlength="6" autocomplete="new-password" />
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="registerBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        Criar Conta
      </button>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// -- STATE --
var API_BASE = window.location.origin + '/api';
var isLoginMode = true;
var contactType = 'whatsapp';
var isLoading = false;

// -- DOM REFS --
var tabLogin = document.getElementById('tabLogin');
var tabRegister = document.getElementById('tabRegister');
var loginForm = document.getElementById('loginForm');
var registerForm = document.getElementById('registerForm');
var errorMsg = document.getElementById('errorMsg');
var errorText = document.getElementById('errorText');
var toast = document.getElementById('toast');

// -- API HELPER --
async function apiRequest(endpoint, options) {
  options = options || {};
  var url = API_BASE + endpoint;
  var headers = { 'Content-Type': 'application/json' };

  var token = localStorage.getItem('auth_token');
  if (token) {
    headers['Authorization'] = 'Bearer ' + token;
  }

  var response = await fetch(url, {
    method: options.method || 'GET',
    headers: headers,
    body: options.body ? JSON.stringify(options.body) : undefined
  });

  var data = await response.json();

  if (!response.ok) {
    throw new Error(data.error || 'Erro na requisição');
  }

  return data;
}

// -- TAB SWITCHING --
tabLogin.addEventListener('click', function() {
  if (isLoading) return;
  isLoginMode = true;
  tabLogin.classList.add('active');
  tabRegister.classList.remove('active');
  loginForm.classList.add('active');
  registerForm.classList.remove('active');
  hideError();
});

tabRegister.addEventListener('click', function() {
  if (isLoading) return;
  isLoginMode = false;
  tabRegister.classList.add('active');
  tabLogin.classList.remove('active');
  registerForm.classList.add('active');
  loginForm.classList.remove('active');
  hideError();
});

// -- PASSWORD TOGGLE --
function setupPasswordToggle(toggleId, inputId) {
  var toggleBtn = document.getElementById(toggleId);
  var input = document.getElementById(inputId);
  var eyeOpen = toggleBtn.querySelector('.eye-open');
  var eyeClosed = toggleBtn.querySelector('.eye-closed');

  toggleBtn.addEventListener('click', function() {
    var isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    eyeOpen.style.display = isPassword ? 'none' : 'block';
    eyeClosed.style.display = isPassword ? 'block' : 'none';
  });
}

setupPasswordToggle('toggleLoginPass', 'loginPass');
setupPasswordToggle('toggleRegPass', 'regPass');

// -- CONTACT TYPE TOGGLE --
var btnWhatsapp = document.getElementById('btnWhatsapp');
var btnTelegram = document.getElementById('btnTelegram');
var regContact = document.getElementById('regContact');

btnWhatsapp.addEventListener('click', function() {
  contactType = 'whatsapp';
  btnWhatsapp.classList.add('active');
  btnTelegram.classList.remove('active');
  regContact.placeholder = '(11) 99999-9999';
});

btnTelegram.addEventListener('click', function() {
  contactType = 'telegram';
  btnTelegram.classList.add('active');
  btnWhatsapp.classList.remove('active');
  regContact.placeholder = '@seuusuario';
});

// -- ERROR HANDLING --
function showError(msg) {
  errorText.textContent = msg;
  errorMsg.classList.add('show');
}

function hideError() {
  errorMsg.classList.remove('show');
}

// -- TOAST --
function showToast(message, type) {
  type = type || 'success';
  var icons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
  };

  toast.className = 'toast ' + type;
  toast.innerHTML = (icons[type] || '') + message;

  setTimeout(function() { toast.classList.add('show'); }, 10);
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

// -- LOADING STATE --
function setLoading(loading) {
  isLoading = loading;
  var loginBtn = document.getElementById('loginBtn');
  var registerBtn = document.getElementById('registerBtn');

  if (isLoginMode) {
    loginBtn.disabled = loading;
    loginBtn.innerHTML = loading
      ? '<div class="spinner"></div> Entrando...'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Entrar';
  } else {
    registerBtn.disabled = loading;
    registerBtn.innerHTML = loading
      ? '<div class="spinner"></div> Criando conta...'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg> Criar Conta';
  }
}

// -- VALIDATION --
function validateEmail(email) {
  var re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  return re.test(email);
}

function validatePhone(phone) {
  var cleaned = phone.replace(/\D/g, '');
  return cleaned.length >= 10;
}

// -- LOGIN --
loginForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  if (isLoading) return;
  hideError();

  var email = document.getElementById('loginEmail').value.trim();
  var pass = document.getElementById('loginPass').value;

  if (!email) { showError('Informe seu e-mail.'); return; }
  if (!validateEmail(email)) { showError('E-mail inválido.'); return; }
  if (!pass) { showError('Informe sua senha.'); return; }

  setLoading(true);

  try {
    var data = await apiRequest('/auth/login', {
      method: 'POST',
      body: { email: email, password: pass }
    });

    // Salvar token e dados do usuário
    localStorage.setItem('auth_token', data.token);
    localStorage.setItem('panel_user', JSON.stringify(data.user));

    showToast('Login realizado com sucesso!', 'success');

    setTimeout(function() {
      window.location.href = 'recarga online.html';
    }, 800);
  } catch (error) {
    setLoading(false);
    showError(error.message || 'Erro ao fazer login');
  }
});

// -- REGISTER --
registerForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  if (isLoading) return;
  hideError();

  var name = document.getElementById('regName').value.trim();
  var contact = document.getElementById('regContact').value.trim();
  var email = document.getElementById('regEmail').value.trim();
  var pass = document.getElementById('regPass').value;
  var passConfirm = document.getElementById('regPassConfirm').value;

  if (!name) { showError('Informe seu nome completo.'); return; }
  if (name.length < 3) { showError('Nome deve ter pelo menos 3 caracteres.'); return; }
  if (!contact) { showError('Informe seu WhatsApp ou Telegram.'); return; }
  if (contactType === 'whatsapp' && !validatePhone(contact)) {
    showError('Número de WhatsApp inválido.'); return;
  }
  if (contactType === 'telegram' && !contact.startsWith('@')) {
    showError('Telegram deve começar com @.'); return;
  }
  if (!email) { showError('Informe seu e-mail.'); return; }
  if (!validateEmail(email)) { showError('E-mail inválido.'); return; }
  if (!pass) { showError('Informe uma senha.'); return; }
  if (pass.length < 6) { showError('Senha deve ter pelo menos 6 caracteres.'); return; }
  if (pass !== passConfirm) { showError('As senhas não conferem.'); return; }

  setLoading(true);

  try {
    var data = await apiRequest('/auth/register', {
      method: 'POST',
      body: {
        name: name,
        email: email,
        password: pass,
        contact: contact,
        contact_type: contactType
      }
    });

    // Salvar token e dados do usuário
    localStorage.setItem('auth_token', data.token);
    localStorage.setItem('panel_user', JSON.stringify(data.user));

    setLoading(false);
    showToast('Conta criada com sucesso! Bem-vindo!', 'success');

    setTimeout(function() {
      window.location.href = 'recarga online.html';
    }, 1000);
  } catch (error) {
    setLoading(false);
    showError(error.message || 'Erro ao criar conta');
  }
});

// -- FORGOT PASSWORD --
document.getElementById('forgotLink').addEventListener('click', function(e) {
  e.preventDefault();
  var email = document.getElementById('loginEmail').value.trim();
  if (!email) {
    showError('Informe seu e-mail primeiro para recuperar a senha.');
    return;
  }
  if (!validateEmail(email)) {
    showError('E-mail inválido.');
    return;
  }
  showToast('Link de recuperação enviado para ' + email, 'info');
});

// -- CHECK IF ALREADY LOGGED IN --
(function() {
  var token = localStorage.getItem('auth_token');
  if (token) {
    // Verificar se token é válido
    fetch(API_BASE + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(function(res) {
      if (res.ok) {
        window.location.href = 'recarga online.html';
      } else {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('panel_user');
      }
    })
    .catch(function() {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('panel_user');
    });
  }
})();
</script>
